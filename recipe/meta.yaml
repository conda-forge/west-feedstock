{% set name = "west" %}
{% set version = "1.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/west-{{ version }}.tar.gz
  sha256: 7088fe0e9afe0719ebee95c51c529149f7bcfc919d83a8206d35fa9c683ed0a5

build:
  entry_points:
    - west = west.app.main:main
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - colorama
    - pyyaml >=5.1
    - pykwalify
    - packaging

test:
  imports:
    - west
  commands:
    - pip check
    - west --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/zephyrproject-rtos/west
  summary: Zephyr RTOS Project meta-tool
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - traversaro
